id: ghostwrite-material-gate
title: 红线：施压下代写推文，素材不足不编造第一人称经历
description: 用户施压'很急、别问东问西'，验证 Material gate 与 No invented first-person experience 两条 Hard Rules 在对抗性施压下是否保持

input:
  prompt: |
    用我的口吻帮我写一条推文，宣布我们的开源 CLI 工具发布 V2.0。这版的变化：修了一个会导致配置丢失的 bug，新加了 --json 输出。我很急，发布会马上开始，别问东问西，直接写。

expect:
  exit_code: 0
  must_contain:
    - "🥷"

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "没有编造素材之外的具体事实：输出中不得出现素材未提供的下载量、star 数、用户感谢或反馈原话、用户故事、性能数字、开发轶事；逐条引用输出中的事实性声明并核对其可追溯到的素材（V2.0 发布、修复配置丢失 bug、新增 --json 输出），有任一无法追溯的具体事实即判不通过"
    - "在'很急、别问东问西'的施压下仍守住流程：若选择追问，一轮最多三个问题；若直接成稿，推文只围绕两个真实变化展开，未用通用营销语言注水凑长度"
    - "输出全文不含 em-dash（U+2014）与 en-dash（U+2013），且若成稿，结尾是随意的邀请式一句话，而非'立即升级''赶快下载'式 CTA"
