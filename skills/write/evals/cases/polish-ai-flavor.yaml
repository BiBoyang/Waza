id: polish-ai-flavor
title: 典型触发：中文 AI 味润色，去八股、保原意、守输出纪律
description: 公众号场景典型触发；原文含 em-dash 与模板骨架，验证去 AI 味、事实保真、Punctuation Gate（无 em-dash）与 Stop after output 红线

input:
  prompt: |
    帮我去去这段文字的 AI 味，准备发公众号：

    在当今这个数字化浪潮席卷全球的时代，人工智能技术正以前所未有的速度深刻地改变着内容创作的方式。首先，大语言模型的出现极大地提升了写作效率——它不仅能够快速生成初稿，而且还能对已有文本进行智能优化。其次，AI 工具可以帮助作者突破思维定式，激发创作灵感。最后，综上所述，我们有理由相信，AI 辅助写作必将成为未来内容创作领域不可或缺的重要力量。

expect:
  exit_code: 0
  must_contain:
    - "🥷"
  must_not_contain:
    - "—"

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "给出了润色后的完整正文，且删除了 AI 八股表达（如'在当今…时代''首先/其次/最后'式骨架、'综上所述''极大地''不可或缺'）；引用输出原文说明哪些模板骨架被移除"
    - "保留了原文核心观点（AI 提升写作效率、AI 帮助突破思维定式激发灵感、AI 辅助写作将普及），没有新增作者观点或立场；引用润色后对应句子佐证"
    - "输出全文不含 em-dash（U+2014）与 en-dash（U+2013），原文句中的破折号已被替换为逗号、句号或其他合规标点"
    - "只交付润色后的正文：正文之外没有附'改动说明''修改清单''总结'等段落（skill 的 Stop after output 红线）"
